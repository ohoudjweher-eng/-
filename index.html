<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>مختبر الكلمة والجملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Layout: one centered column — station chips on top, a single "lab card" stage below, big tap targets for a phone or a classroom screen */
:root{
  --bg:#EDF3EE; --surface:#FFFFFF; --sunk:#E2EBE4; --ink:#1D2B27; --muted:#5B6D67; --line:#CCDAD1;
  --green:#3B8A4C; --green-soft:#DCEFE0;
  --ism:#2A66AC; --ism-soft:#E1ECF8; --fil:#C9621A; --fil-soft:#FBEBDD; --harf:#7A4DB3; --harf-soft:#EEE6F8;
  --good:#2E8455; --good-soft:#DDF2E5; --bad:#C2372F; --bad-soft:#FBE3E1; --gold:#D9A21B;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-word:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;
  --f-ui:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A17; --surface:#1B2521; --sunk:#16201C; --ink:#E6EEEA; --muted:#9BB0A8; --line:#2C3A35;
  --green:#6BBF7D; --green-soft:#1F3627;
  --ism:#79AEEB; --ism-soft:#1B2C42; --fil:#F0A060; --fil-soft:#3A2717; --harf:#B79AE8; --harf-soft:#2C2240;
  --good:#61CB8E; --good-soft:#173627; --bad:#F2817A; --bad-soft:#3F1D1B; --gold:#F0C04A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A17; --surface:#1B2521; --sunk:#16201C; --ink:#E6EEEA; --muted:#9BB0A8; --line:#2C3A35;
  --green:#6BBF7D; --green-soft:#1F3627;
  --ism:#79AEEB; --ism-soft:#1B2C42; --fil:#F0A060; --fil-soft:#3A2717; --harf:#B79AE8; --harf-soft:#2C2240;
  --good:#61CB8E; --good-soft:#173627; --bad:#F2817A; --bad-soft:#3F1D1B; --gold:#F0C04A; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:1.7rem;margin:0;color:var(--green);text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.score{font-family:var(--f-display);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.score b{color:var(--gold);font-size:1.15rem}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{flex:0 0 auto;font-family:var(--f-ui);font-size:.9rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab .n{font-family:var(--f-display);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--green);border-color:var(--green);color:var(--surface)}
.tab[aria-selected="true"] .n{color:var(--surface)}
.tab .st{color:var(--gold);font-size:.8rem}
.stage{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px;min-height:380px}
.rule{background:var(--green-soft);border-radius:12px;padding:10px 14px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.rule .tag{font-family:var(--f-display);background:var(--green);color:var(--surface);border-radius:8px;padding:0 10px;flex:0 0 auto}
.st-title{font-family:var(--f-display);font-size:1.3rem;margin:0}
.prog{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.card{background:var(--sunk);border-radius:16px;padding:26px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.word{font-family:var(--f-word);font-size:clamp(2.4rem,9vw,3.6rem);font-weight:700;line-height:1.5}
.sent{font-family:var(--f-word);font-size:clamp(1.35rem,5vw,1.8rem);font-weight:500;line-height:1.9;text-wrap:balance}
.sent mark{background:var(--gold);color:#1D2B27;border-radius:6px;padding:0 4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.opt{font-family:var(--f-display);font-size:1.25rem;padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .12s}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt:disabled{cursor:default;opacity:.55}
.opt.ism{border-color:var(--ism);color:var(--ism)} .opt.fil{border-color:var(--fil);color:var(--fil)} .opt.harf{border-color:var(--harf);color:var(--harf)}
.opt.g{border-color:var(--green);color:var(--green)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);opacity:1}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);opacity:1}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb p{margin:0}
.fb strong{font-family:var(--f-display);font-size:1.1rem}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}
.btn{font-family:var(--f-display);font-size:1.05rem;border:0;border-radius:12px;padding:10px 20px;background:var(--green);color:var(--surface);cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--green);border:2px solid var(--green)}
.al-btn{font-family:var(--f-display);font-size:1rem;border:2px dashed var(--green);background:var(--surface);color:var(--green);border-radius:12px;padding:6px 16px;cursor:pointer}
.al{color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px}
.chip{font-family:var(--f-word);font-size:1.35rem;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:4px 14px;cursor:pointer}
.chip.used{visibility:hidden}
.line{border-bottom:2px dashed var(--line);min-height:62px;align-items:center;width:100%}
.line .chip{border-color:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.grid .chip{width:100%}
.timer{height:10px;width:100%;background:var(--sunk);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--fil);border-radius:99px;transform-origin:right}
.result{text-align:center;align-items:center;justify-content:center;flex:1;display:flex;flex-direction:column;gap:12px}
.stars{font-size:2.6rem;color:var(--gold);letter-spacing:6px}
.stars .off{color:var(--line)}
.big{font-family:var(--f-display);font-size:1.6rem;margin:0}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:4px}
footer{text-align:center;color:var(--muted);font-size:.8rem}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@keyframes pop{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}
.card{animation:pop .25s ease-out}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.opt{transition:none}}
@media (max-width:420px){.stage{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>

<div class="wrap" dir="rtl">
  <header>
    <div>
      <h1>مختبر الكلمة والجملة</h1>
      <p class="sub">الوظيفة النحوية · الدرس الأول: أنواع الكلمة والجملة</p>
    </div>
    <div class="score" aria-live="polite">نقاطي <b id="total">0</b></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main class="stage" id="stage" aria-live="polite"></main>
  <footer>نشاط تفاعلي مبني على صفحات الكتاب · ٦٧–٧٤</footer>
</div>

<script>
document.documentElement.lang='ar';
const $=s=>document.querySelector(s);
const stage=$('#stage');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const best={};
const TYPE={ism:'اسم',fil:'فعل',harf:'حرف'};
const HINT={
  ism:'يدل على معنى في نفسه غير مقترن بزمن، ويقبل (ال).',
  fil:'يدل على حدث مقترن بزمن.',
  harf:'لا يتضح معناه إلا مع غيره.'
};

/* ===== Data from the book ===== */
const WORDS=[
 ['سَفَر','ism'],['حُقُول','ism'],['مِنْ','harf'],['انْطَلَقَ','fil'],['إِلَى','harf'],['مُمْتَدَّة','ism'],
 ['أَشْجَار','ism'],['انْجِرَاف','ism'],['مَنْظَر','ism'],['فِي','harf'],['يَمْلَأُ','fil'],['سَمَاء','ism'],
 ['أَشْرَقَ','fil'],['دَوَاء','ism'],['يُفَكِّرُ','fil'],['سَاعَدَ','fil'],['فَوَاكِه','ism'],['يَنْصَحُ','fil'],
 ['مُتَكَامِل','ism'],['يُغَرِّدُ','fil'],['طُيُور','ism'],['عَنْ','harf'],['عَلَى','harf'],['جَهَّزَتْ','fil'],
 ['رِحْلَة','ism'],['الْمَكَان','ism'],['قَدْ','harf']
].map(([w,a])=>({w,a}));

const AL=[
 {w:'بَيْت',al:'الْبَيْت',a:'ism'},{w:'نَامَ',al:'النَّامَ',a:'fil'},{w:'شَجَرَة',al:'الشَّجَرَة',a:'ism'},
 {w:'يَلْعَبُ',al:'الْيَلْعَبُ',a:'fil'},{w:'قَمَر',al:'الْقَمَر',a:'ism'},{w:'جَلَسَ',al:'الْجَلَسَ',a:'fil'},
 {w:'حَدِيقَة',al:'الْحَدِيقَة',a:'ism'},{w:'كَتَبَ',al:'الْكَتَبَ',a:'fil'}
];

const SENT=[
 {s:'يَخْرُجُ النَّاسُ إِلَى الرِّيَاضِ الْمُزْهِرَةِ.',f:'يَخْرُجُ',a:'fil'},
 {s:'الْوَعْيُ الصِّحِّيُّ مَطْلَبٌ ضَرُورِيٌّ.',f:'الْوَعْيُ',a:'ism'},
 {s:'تَسُرُّ الْمَخْلُوقَاتِ بِجَمَالِ الطَّبِيعَةِ.',f:'تَسُرُّ',a:'fil'},
 {s:'صِحَّةُ الْجِسْمِ نِعْمَةٌ عَظِيمَةٌ.',f:'صِحَّةُ',a:'ism'},
 {s:'النَّبَاتَاتُ غِذَاءٌ لِلْإِنْسَانِ.',f:'النَّبَاتَاتُ',a:'ism'},
 {s:'انْطَلَقَ الْجَدُّ مِشْعَلٌ مَعَ حَفِيدَيْهِ صَبَاحًا.',f:'انْطَلَقَ',a:'fil'},
 {s:'الْبَحْرُ هَادِئٌ.',f:'الْبَحْرُ',a:'ism'},
 {s:'يَبْنُونَ الْقُصُورَ بِالرِّمَالِ.',f:'يَبْنُونَ',a:'fil'},
 {s:'رَحَلَ الشِّتَاءُ بِبَرْدِهِ الْقَارِسِ.',f:'رَحَلَ',a:'fil'},
 {s:'السَّمَاءُ صَافِيَةٌ.',f:'السَّمَاءُ',a:'ism'}
];

const NEG=[
 {s:'دُودَةُ الْقَزِّ تَصْنَعُ الْحَرِيرَ.',a:'pos'},
 {s:'لَنْ أُلَوِّثَ بِيئَتِي.',t:'لَنْ',a:'neg'},
 {s:'النَّظَافَةُ أَيْسَرُ طَرِيقَةٍ لِلتَّخَلُّصِ مِنَ الْجَرَاثِيمِ.',a:'pos'},
 {s:'لَيْسَتِ الْأَزْهَارُ مُتَفَتِّحَةً.',t:'لَيْسَتِ',a:'neg'},
 {s:'لَمْ تَتَفَتَّحِ الْأَزْهَارُ.',t:'لَمْ',a:'neg'},
 {s:'مَا تَفَتَّحَتِ الْأَزْهَارُ.',t:'مَا',a:'neg'},
 {s:'تَفَتَّحَتِ الْأَزْهَارُ.',a:'pos'},
 {s:'غَابَتِ الشَّمْسُ وَنَزَلَ الْمَطَرُ.',a:'pos'},
 {s:'لَيْسَتِ الرِّيَاحُ قَوِيَّةً.',t:'لَيْسَتِ',a:'neg'},
 {s:'مَا اقْتَلَعَتِ الرِّيَاحُ الْأَشْجَارَ.',t:'مَا',a:'neg'}
];

const ORDER=[
 ['نَظَرْتُ','إِلَى','الْقَمَرِ'],
 ['نُحَافِظُ','عَلَى','بِيئَتِنَا','لِنَحْمِيَ','صِحَّتَنَا'],
 ['أَحْرِصُ','عَلَى','الْغِذَاءِ','الْمُتَوَازِنِ'],
 ['رَحَلَ','الصَّيْفُ','بِحَرِّهِ','الشَّدِيدِ']
];

const SPEED=['شَاهَدَ','عَمِلَ','تَأَلَّمَ','فِي','يُدَافِعُ','مِنْ','رَفَعَ','إِلَى','ثَرْوَةٌ','يَجْمَعُ','يَتَغَذَّى','حَافَظَ','شَكَرَ','صَامَ','يَحْمِي'];

/* ===== Stations ===== */
const STATIONS=[
 {id:'s1',name:'أصنّف الكلمة',run:()=>quiz({id:'s1',title:'أصنّف الكلمة',
   rule:'الكلمة ثلاثة أقسام: اسمٌ وفعلٌ وحرفٌ.',
   items:WORDS,n:12,options:[{k:'ism',l:'اسم',c:'ism'},{k:'fil',l:'فعل',c:'fil'},{k:'harf',l:'حرف',c:'harf'}],
   prompt:it=>`<div class="word">${it.w}</div>`,
   explain:it=>`كلمة «${it.w}» <b>${TYPE[it.a]}</b>: ${HINT[it.a]}`})},
 {id:'s2',name:'اختبار (ال)',run:()=>quiz({id:'s2',title:'اختبار (ال)',
   rule:'كي أميّز الاسم من الفعل أُدخل (ال) على الكلمة: إن قبلتها فهي اسم، وإن لم تقبلها فهي فعل.',
   items:AL,n:8,gate:true,options:[{k:'ism',l:'تصحّ ← اسم',c:'ism'},{k:'fil',l:'لا تصحّ ← فعل',c:'fil'}],
   prompt:it=>`<div class="word" id="alw">${it.w}</div><button class="al-btn" id="alb">أُدخِل (ال) على الكلمة</button>`,
   setup:(it,enable)=>{$('#alb').onclick=()=>{$('#alw').innerHTML=`<span class="al">${it.al}</span>`;$('#alb').remove();enable()}},
   explain:it=>it.a==='ism'?`«${it.al}» تصحّ، إذن «${it.w}» <b>اسم</b>.`:`لا نقول «${it.al}»، إذن «${it.w}» <b>فعل</b>.`})},
 {id:'s3',name:'اسمية أم فعلية',run:()=>quiz({id:'s3',title:'اسمية أم فعلية؟',
   rule:'الجملة نوعان: الاسمية تبدأ باسم، والفعلية تبدأ بفعل.',
   items:SENT,n:8,options:[{k:'ism',l:'جملة اسمية',c:'ism'},{k:'fil',l:'جملة فعلية',c:'fil'}],
   prompt:it=>`<div class="sent" id="sx">${it.s}</div>`,
   after:it=>{$('#sx').innerHTML=it.s.replace(it.f,`<mark>${it.f}</mark>`)},
   explain:it=>`بدأت الجملة بـ«${it.f}» وهو ${TYPE[it.a]}، إذن هي <b>جملة ${it.a==='ism'?'اسمية':'فعلية'}</b>.`})},
 {id:'s4',name:'مثبتة أم منفية',run:()=>quiz({id:'s4',title:'مثبتة أم منفية؟',
   rule:'إذا ثبت الحدث وتحقق فالجملة مثبتة، وإذا لم يتحقق فهي منفية. من أدوات النفي: ليس، لم، ما، لن.',
   items:NEG,n:8,options:[{k:'pos',l:'مثبتة',c:'g'},{k:'neg',l:'منفية',c:'fil'}],
   prompt:it=>`<div class="sent" id="sx">${it.s}</div>`,
   after:it=>{if(it.t)$('#sx').innerHTML=it.s.replace(it.t,`<mark>${it.t}</mark>`)},
   explain:it=>it.a==='neg'?`فيها أداة النفي «${it.t}»، فالحدث لم يقع: <b>جملة منفية</b>.`:`الحدث وقع وتحقق، ولا توجد أداة نفي: <b>جملة مثبتة</b>.`})},
 {id:'s5',name:'أرتّب الجملة',run:()=>order()},
 {id:'s6',name:'تحدّي ٥ ثوانٍ',run:()=>speed()}
];

let cur=0,timerId=null;
function tabs(){
  $('#tabs').innerHTML=STATIONS.map((s,i)=>{
    const b=best[s.id];const st=b!=null?`<span class="st">${'★'.repeat(b)}</span>`:'';
    return `<button class="tab" role="tab" aria-selected="${i===cur}" data-i="${i}"><span class="n">${i+1}</span>${s.name}${st}</button>`}).join('');
  $('#tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(+t.dataset.i));
}
function go(i){clearTimeout(timerId);cur=i;tabs();STATIONS[i].run();const t=$('#tabs').children[i];t&&t.scrollIntoView({inline:'nearest',block:'nearest'})}
function total(){let s=0;for(const k in best)s+=best[k];$('#total').textContent=s+' ★'}
function head(title,rule){return `<h2 class="st-title">${title}</h2>${rule?`<div class="rule"><span class="tag">أستنتج</span><span>${rule}</span></div>`:''}`}
function prog(i,n){return `<div class="prog"><span>${i+1} / ${n}</span><div class="bar"><i style="width:${(i/n)*100}%"></i></div></div>`}
function stars(sc,n){return sc===n?3:sc>=n*0.7?2:sc>=n*0.4?1:0}
function finish(id,sc,n,extra){
  const s=stars(sc,n);best[id]=Math.max(best[id]??0,s);tabs();total();
  const msg=['حاول مرة أخرى، ستتحسّن!','بداية جيدة 👏','أحسنت!','ممتاز! إتقان كامل 🌟'][s];
  stage.innerHTML=`<div class="result"><div class="stars">${'★'.repeat(s)}<span class="off">${'★'.repeat(3-s)}</span></div>
   <p class="big">${msg}</p><p class="sub">${extra||`أجبت ${sc} من ${n} إجابة صحيحة`}</p>
   <div class="row" style="justify-content:center"><button class="btn ghost" id="again">أعِد المحطة</button>
   ${cur<STATIONS.length-1?`<button class="btn" id="next">المحطة التالية ←</button>`:''}</div></div>`;
  $('#again').onclick=()=>go(cur);const nx=$('#next');nx&&(nx.onclick=()=>go(cur+1));
}

function quiz(c){
  const items=shuffle(c.items).slice(0,c.n);let i=0,sc=0;
  const show=()=>{
    if(i>=items.length)return finish(c.id,sc,items.length);
    const it=items[i];let done=false;
    stage.innerHTML=head(c.title,c.rule)+prog(i,items.length)+
      `<div class="card">${c.prompt(it)}</div>
       <div class="opts">${c.options.map(o=>`<button class="opt ${o.c}" data-k="${o.k}" ${c.gate?'disabled':''}>${o.l}</button>`).join('')}</div>
       <div class="fb" id="fb" hidden></div>`;
    const btns=[...stage.querySelectorAll('.opt')];
    if(c.setup)c.setup(it,()=>btns.forEach(b=>b.disabled=false));
    btns.forEach(b=>b.onclick=()=>{
      if(done)return;done=true;const ok=b.dataset.k===it.a;if(ok)sc++;
      btns.forEach(x=>{x.disabled=true;if(x.dataset.k===it.a)x.classList.add('right')});
      if(!ok)b.classList.add('wrong');
      if(c.after)c.after(it);
      const fb=$('#fb');fb.hidden=false;fb.className='fb '+(ok?'ok':'no');
      fb.innerHTML=`<strong>${ok?'إجابة صحيحة ✔':'ليست صحيحة ✘'}</strong><p>${c.explain(it)}</p><button class="btn" id="nx">${i<items.length-1?'التالي ←':'النتيجة'}</button>`;
      $('#nx').onclick=()=>{i++;show()};$('#nx').focus();
    });
  };show();
}

function order(){
  const items=shuffle(ORDER);let i=0,sc=0;
  const show=()=>{
    if(i>=items.length)return finish('s5',sc,items.length);
    const right=items[i];let pool=shuffle(right.map((w,k)=>({w,k})));
    while(items[i].length>1&&pool.every((p,k)=>p.k===k))pool=shuffle(pool);
    let picked=[],tries=0;
    const draw=()=>{
      stage.innerHTML=head('أرتّب الكلمات لأكوّن معنًى مفيدًا','عندما تجتمع الكلمات لتكوين معنى مفيد فإنها تسمّى جملة.')+prog(i,items.length)+
       `<div class="card"><div class="chips line" id="line">${picked.length?picked.map((p,x)=>`<button class="chip" data-x="${x}">${p.w}</button>`).join(''):'<span class="sub">اضغط على الكلمات بالترتيب الصحيح</span>'}</div>
       <div class="chips" id="pool">${pool.map(p=>`<button class="chip ${picked.includes(p)?'used':''}" data-k="${p.k}">${p.w}</button>`).join('')}</div></div>
       <div class="row"><button class="btn" id="chk" ${picked.length<right.length?'disabled style="opacity:.5"':''}>تحقّق</button><button class="btn ghost" id="clr">امسح</button></div>
       <div class="fb" id="fb" hidden></div>`;
      $('#pool').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const p=pool.find(q=>q.k==b.dataset.k);if(!picked.includes(p)){picked.push(p);draw()}});
      $('#line').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.x,1);draw()});
      $('#clr').onclick=()=>{picked=[];draw()};
      $('#chk').onclick=()=>{
        const ok=picked.every((p,k)=>p.k===k);tries++;const fb=$('#fb');fb.hidden=false;
        if(ok){if(tries===1)sc++;fb.className='fb ok';fb.innerHTML=`<strong>جملة مفيدة ✔</strong><p class="sent" style="font-size:1.3rem">${right.join(' ')}.</p><button class="btn" id="nx">${i<items.length-1?'التالي ←':'النتيجة'}</button>`;
          $('#nx').onclick=()=>{i++;show()};$('#chk').disabled=true;$('#clr').disabled=true;}
        else{fb.className='fb no';fb.innerHTML=`<strong>الترتيب يحتاج تعديلًا</strong><p>تلميح: الجملة تبدأ بكلمة «${right[0]}».</p>`}
      };
    };draw();
  };show();
}

function speed(){
  const intro=()=>{
    stage.innerHTML=head('تحدّي ٥ ثوانٍ','الاسم يدل على معنى في نفسه غير مقترن بزمن.')+
     `<div class="card"><p class="big">ابحث عن <span style="color:var(--ism)">اسمٍ واحدٍ فقط</span> بين الكلمات</p><p class="sub">لديك ٥ ثوانٍ فقط. هل أنت مستعد؟</p><button class="btn" id="go" style="align-self:center">ابدأ التحدّي</button></div>`;
    $('#go').onclick=play;
  };
  const play=()=>{
    const ws=shuffle(SPEED);let over=false;
    stage.innerHTML=head('تحدّي ٥ ثوانٍ')+`<div class="timer"><i id="tm"></i></div><div class="grid">${ws.map(w=>`<button class="chip" data-w="${w}">${w}</button>`).join('')}</div><div class="fb" id="fb" hidden></div>`;
    const tm=$('#tm');if(!matchMedia('(prefers-reduced-motion: reduce)').matches)tm.style.animation='shrink 5s linear forwards';
    const end=(win,b)=>{if(over)return;over=true;clearTimeout(timerId);tm.style.animationPlayState='paused';
      stage.querySelectorAll('.grid .chip').forEach(c=>{c.disabled=true;if(c.dataset.w==='ثَرْوَةٌ'){c.style.borderColor='var(--good)';c.style.background='var(--good-soft)'}});
      if(b&&!win){b.style.borderColor='var(--bad)';b.style.background='var(--bad-soft)'}
      const fb=$('#fb');fb.hidden=false;fb.className='fb '+(win?'ok':'no');
      fb.innerHTML=`<strong>${win?'وجدته! ✔':(b?'هذه ليست اسمًا':'انتهى الوقت ⏱')}</strong><p>«ثَرْوَةٌ» هي الاسم الوحيد، وتقبل (ال): الثروة. البقية أفعال وحروف.</p><button class="btn" id="nx">النتيجة</button>`;
      $('#nx').onclick=()=>finish('s6',win?1:0,1,win?'أنت سريع ودقيق!':'جرّب مرة أخرى وركّز على الكلمة التي تقبل (ال).');
    };
    stage.querySelectorAll('.grid .chip').forEach(b=>b.onclick=()=>end(b.dataset.w==='ثَرْوَةٌ',b));
    timerId=setTimeout(()=>end(false),5000);
  };
  intro();
}

tabs();total();go(0);
</script>
